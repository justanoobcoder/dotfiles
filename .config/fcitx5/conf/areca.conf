# Chế độ hiển thị
# PresentationMode="Rewrite trực tiếp"
# Phím tắt chuyển chế độ gõ
# SwitchModeKey=
# Biểu tượng khay hệ thống
# TrayIcon=org.fcitx.Fcitx5.fcitx-areca
# Kiểu gõ Bamboo
BambooInputMethod=Telex
# Bảng mã đầu ra
# OutputCharset=Unicode
# Chế độ kiểm tra chính tả
# SpellcheckMode="Khôi phục từ ngay trong lúc gõ"
# Đặt dấu kiểu oà, uý thay cho òa, úy
# ModernStyle=True
# Tự viết hoa sau dấu kết câu (. ! ?)
# AutoCapitalizeAfterPunctuation=False
# Gợi ý emoji khi gõ :từ
EmojiSuggestion=True
# Bật macro
# EnableMacro=True
# Tự đổi hoa/thường cho nội dung macro
# CapitalizeMacro=True
# Hoàn tác macro khi nhấn Backspace
# RevertMacroOnBackspace=True
# Phím giữ để tạm bỏ qua macro khi nhấn Space
# MacroBypassModifier=Shift
# Khôi phục lỗi chính tả khi nhấn Backspace
# BackspaceRecovery=True
# Cho phép sửa từ đã commit
# RestoreSurroundingText=False
# Tắt tiếng Việt trong terminal
# DisableVietnameseInTerminal=False
# Bật log debug Areca
# Debug=False

[SelectBackendKey]
0=Control+grave

