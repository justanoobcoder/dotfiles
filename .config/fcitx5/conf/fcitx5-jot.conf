# Cấu hình fcitx5-jot (được ghi bởi jot-settings)
[Jot]
# UnderlineFree | Preedit
Mode=UnderlineFree
# Auto | Forward | Virtkey | Surrounding
Backend=Auto
FreeToneMarking=True
# Đặt dấu oà, uý (thay vì òa, úy)
ToneOaUy=True
# Gõ nhanh: w thành ư (nhw -> như); QuickWAtWordStart: cả ở đầu từ (w -> ư)
QuickW=False
QuickWAtWordStart=False
# Gõ nhanh: [ ] { } thành ơ ư Ơ Ư (t[ -> tơ); QuickBracketAtWordStart: cả ở đầu từ
QuickBracket=False
QuickBracketAtWordStart=False
# Trả lại phím đã gõ khi chữ không phải tiếng Việt (cỏe -> core)
RestoreNonVietnamese=True
# Trả lại phím đã gõ khi chữ dính với số (má20 -> mas20, 17hí -> 17his)
RestoreWithDigits=True
EnableMacro=True
MacroUppercase=True
# Bung gõ tắt cả khi gõ dấu câu , . ? ! ; : ' " ) ] }
MacroOnPunctuation=True
# Sửa dấu từ đã gõ khi đặt con trỏ ngay sau nó (cần surrounding text)
EditCommittedWord=True
# Tự động viết hoa chữ đầu sau Enter, hoặc sau . ! ? và dấu cách
AutoCapitalize=False
# Phím tắt mở menu chọn chế độ gõ cho ứng dụng
ModeMenuKey=Control+grave
# Phím tắt tăng độ trễ commit của ứng dụng hiện tại thêm 1 ms
DelayUpKey=Control+Alt+equal
# Phím tắt bật/tắt tiếng Việt (được ghi nhớ theo ứng dụng)
ToggleKey=Super+space
# Ứng dụng chưa từng bật/tắt tiếng Việt thì bắt đầu ở EN
NewAppEnglish=True
Debug=False
# Nhật ký gỡ lỗi ghi cả chữ gõ trong ô nhạy cảm (cửa sổ ẩn danh), trừ ô mật khẩu
DebugSensitive=False
