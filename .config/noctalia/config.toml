[bar.default]
background_opacity = 0.56999998725950718
capsule = true
capsule_fill = "on_primary"
capsule_foreground = "primary"
center = [ "audio_visualizer", "temp", "weather", "clock", "cpu", "ram" ]
end = [ "privacy", "Warp", "tray", "volume", "battery", "network", "notifications" ]
margin_edge = 3
margin_ends = 5
padding = 5
shadow = false
start = [ "workspaces", "recorder", "widget", "screenshot" ]

    [bar.default.dead_zone.actions]
    scroll_down = "workspace-switch next"
    scroll_left = "exec hyprctl dispatch 'hl.dsp.focus({ direction = \"left\" })'"
    scroll_right = "exec hyprctl dispatch 'hl.dsp.focus({ direction = \"right\" })'"
    scroll_up = "workspace-switch prev"

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[calendar]
enabled = true

    [calendar.account.991862888219]
    name = "Justanoobcoder Calendar"
    type = "google"

[location]
address = "Quy Nhơn, Gia Lai"

[lockscreen_widgets]
enabled = true
schema_version = 1
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "eDP-1"
    rotation = 0.0
    scale = 1.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        show_login_button = true

[osd.kinds]
media = false

[plugin_settings."noctalia/screen_recorder"]
directory = "~/xdg/videos/recordings"

[plugins]
enabled = [ "noctalia/screen_recorder", "oldirtty/color_picker" ]

[shell]
avatar_path = "/home/hiepnh/.face.png"
clipboard_enabled = false
font_family = "JetBrainsMono Nerd Font"
password_style = "random"
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = false

    [shell.panel]
    borders = false
    session_placement = "centered"
    shadow = false
    transparency_mode = "glass"

    [shell.screenshot]
    pipe_command = "swappy -f -"
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "o"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "u"
    variant = "destructive"

[theme]
builtin = "m3-content"
community_palette = "ADW"
custom_palette = "ADW"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "qt" ]

[wallpaper]
directory = "/home/hiepnh/xdg/pictures/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/hiepnh/xdg/pictures/wallpapers/wallpaper-gate.jpeg"

    [wallpaper.last]
    path = "/home/hiepnh/xdg/pictures/wallpapers/wallpaper-gate.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/hiepnh/xdg/pictures/wallpapers/wallpaper-gate.jpeg"

[widget.Warp]
glyph = "cloud"
tooltip = "Cloudflare Warp"
type = "custom_button"

    [widget.Warp.actions]
    left = "exec warp-cli connect"
    right = "exec warp-cli disconnect"

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.clock]
anchor = true
format = "{:%H:%M, %a %b %d}"

[widget.cpu]
display = "text"

[widget.media]
album_art_only = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.ram]
display = "text"
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.screen_recorder]
audio_source = "both"
directory = "/home/hiepnh/xdg/videos/recordings"
script = "scripts/screen_recorder.lua"
type = "scripted"

[widget.weather]
enabled = false
show_condition = false

[widget.widget]
type = "oldirtty/color_picker:widget"
