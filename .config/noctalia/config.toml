transition_on_startup = true

    [wallpaper.default]
    path = "/home/hiepnh/xdg/pictures/wallpapers/anime_skull.png"

    [wallpaper.last]
    path = "/home/hiepnh/xdg/pictures/wallpapers/anime_skull.png"

