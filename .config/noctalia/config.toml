[osd.kinds]
media = false

[plugin_settings."noctalia/screen_recorder"]
directory = "~/xdg/videos/recordings"

[plugin_settings."yuuto/calculator"]
angle_unit = "deg"
panel_position = "center"

[plugins]
enabled = [ "noctalia/screen_recorder", "oldirtty/color_picker", "noctalia/timer", "yuuto/calculator" ]

[shell]
avatar_path = "/home/hiepnh/.face.png"
clipboard_enabled = true
clipboard_image_action_command = "imv {path}"
font_family = "JetBrainsMono Nerd Font"
password_style = "random"
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = false

    [shell.launcher.providers.windows]
    prefix = ""

    [shell.panel]
    borders = false
    session_placement = "centered"
    shadow = false
    transparency_mode = "glass"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/hiepnh/xdg/pictures/screenshots"
    pipe_command = "swappy -f -"
    remember_last_region = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "o"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "u"
    variant = "destructive"

[theme]
builtin = "Kanagawa"
community_palette = "ADW"
custom_palette = "ADW"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "niri", "qt", "umbriel" ]

[wallpaper]
