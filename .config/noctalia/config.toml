tooltip = "Cloudflare Warp"
type = "custom_button"

    [widget.Warp.actions]
    left = "exec warp-cli connect"
    right = "exec warp-cli disconnect"

[widget.audio_visualizer]
show_when_idle = true

[widget.bar]
type = "noctalia/timer:bar"

[widget.bar_2]
