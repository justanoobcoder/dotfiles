[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^(kitty|com\\.mitchellh\\.ghostty)$"
default_width = 0.5

[[window_rule]]
match.title = "^(jcm|Fcitx Configuration|Lotus Settings|Zed — Settings)$"
default_floating = true

[[window_rule]]
match.app_id = "^(xdg-desktop-portal-gtk)$"
default_floating = true
default_size = [1200, 800]

[[window_rule]]
match.app_id = "^(zen|brave-browser)$"
default_workspace = 2
default_width = 1.0

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_size = [1200, 900]
blur_popups = false

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_size = [800, 600]

[[window_rule]]
match.is_focused = false
opacity = 0.85

[[window_rule]]
match.is_focused = true
opacity = 1.0

[[window_rule]]
match.app_id = "keypop"
opacity = 0.8
blur = false
default_focused = false
default_pinned = true
default_position = { x = 10, y = 10, anchor = "bottom_right" }

[[window_rule]]
match.app_id = "mpv"
default_floating = true
default_size = [1280, 720]

[[window_rule]]
match.title = "webcam-mpv"
default_pinned = true

[[window_rule]]
match.app_id = "^it.catboy.ripdrag$"
default_pinned = true
default_position = { x = 10, y = 10, anchor = "bottom_right" }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
