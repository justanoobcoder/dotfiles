[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^(foot|footclient|kitty|com\\.mitchellh\\.ghostty|jotty|rio)$"
default_scrolling_extent = 0.5

[[window_rule]]
match.title = "^(Fcitx Configuration|Lotus Settings|Areca Settings|Zed — Settings|Jot Settings)$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^(xdg-desktop-portal-gtk)$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^(zen|brave-browser|org\\.ladybird\\.Ladybird|helium)$"
default_workspace = 2
default_scrolling_extent = 1.0

[[window_rule]]
match.app_id = "^(dev.noctalia.Noctalia|unda-settings)$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^unda-editor$"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.is_focused = false
opacity = 0.85

[[window_rule]]
match.is_focused = true
opacity = 1.0

[[window_rule]]
match.is_alone = true
default_scrolling_extent = 1.0

[[window_rule]]
match.app_id = "wayshadow"
opacity = 0.8
blur = false
default_focused = false
default_pinned = true
default_position = { x = 10, y = 10, anchor = "bottom_right" }

[[window_rule]]
match.app_id = "^it.catboy.ripdrag$"
default_pinned = true
default_focused = false
default_position = { x = 10, y = 10, anchor = "bottom_right" }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[window_rule]]
match.app_id = "^org\\.keepassxc\\.KeePassXC$"
default_scratchpad = "keepass"

[[window_rule]]
match.app_id = "^Godot$"
match.title = ".*\\(DEBUG\\)$"
default_floating = true

[[window_rule]]
match.app_id = "^webcam-mpv$"
default_focused = false
focus_on_activate = false
default_floating = true
default_pinned = true
border_width = 0
default_floating_size = { width = 0.15, height = 0.15 }
default_position = { x = 10, y = 0, anchor = "right" }

[[window_rule]]
match.title = "(Bitwarden|Extension.*Bitwarden.*)"
default_floating = true
default_floating_size = { width = 0.3, height = 0.8 }
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^unda-(settings|editor)$"
blur = true

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = false
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

[[layer_rule]]
match.namespace = ["^unda-bar$", "^unda-tip$", "^unda-popup$", "^unda-notifications$", "^unda-osd$"]
blur = true
blur_ignore_alpha = 0.3

[[layer_rule]]
match.namespace = ["^unda-popup$", "^unda-notifications$", "^unda-osd$"]
blur = true
blur_ignore_alpha = 0.3
blur_optimized = false
