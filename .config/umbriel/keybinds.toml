[[scratchpad]]
name = "keepass"

[keybinds]
"Mod+Return" = { action = "spawn jotty --single-instance", repeat = false }
"Mod+W" = { action = "spawn helium --enable-features=AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs --ignore-gpu-blocklist --use-gl=angle --use-angle=gl", repeat = false }
"Mod+P" = { action = "spawn unda msg toggle launcher", repeat = false }
"Mod+Shift+B" = { action = "spawn unda msg toggle bar", repeat = false }
"Mod+Shift+Q" = { action = "spawn unda msg toggle session-menu", repeat = false }
"Super+X" = { action = "spawn unda msg toggle session-menu", repeat = false }
"Mod+F1" = { action = "spawn /home/hiepnh/.local/bin/webcam-mpv", repeat = false }
"Mod+F2" = { action = "spawn unda msg toggle keystrokes", repeat = false }
"Mod+F12" = { action = "spawn unda msg toggle calculator", repeat = false }
"Super+I" = { action = "spawn unda msg toggle settings", repeat = false }
"Super+L" = "spawn unda msg lock"
"Super+V" = { action = "spawn unda msg toggle clipboard", repeat = false }
"Super+C" = { action = "spawn unda msg toggle color-picker", repeat = false }
"Super+Shift+S" = { action = "spawn unda msg screenshot region", repeat = false }
"Print" = { action = "spawn unda msg screenshot full", repeat = false }
"Ctrl+Print" = { action = "spawn unda msg screenshot window", repeat = false }
"Mod+Shift+R" = "config-reload"
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = "window-close"
"Mod+Escape" = "session-quit"
"Ctrl+Shift+F12" = { action = "spawn ~/.config/umbriel/toggle-umbriel-mod", repeat = false }

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

"Mod+I" = "workspace-previous"
"Mod+M" = "workspace-next"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

"Mod+Shift+H" = "column-move-left"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+I" = "window-move-to-workspace-previous"
"Mod+Shift+M" = "window-move-to-workspace-next"

"Mod+Comma" = "window-consume-left"
"Mod+Ctrl+Comma" = "window-consume-or-expel-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+Period" = "window-consume-or-expel-right"

"Mod+WheelUp" = "workspace-previous"
"Mod+WheelDown" = "workspace-next"
"Mod+WheelLeft" = "window-focus-left"
"Mod+WheelRight" = "window-focus-right"

"Mod+Tab" = { action = "workspace-focus-last", repeat = false }

"Super+Shift+K" = "window-toggle-scratchpad keepass"
"Super+K" = "scratchpad-toggle keepass"

"Mod+R" = "window-cycle-primary-extent-back"
"Mod+F" = "window-toggle-maximize"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+V" = "window-toggle-floating"
"Mod+Shift+V" = "window-focus-switch-floating"
"Mod+Shift+P" = "window-toggle-pinned"

"XF86AudioRaiseVolume" = "spawn unda msg volume up 2"
"XF86AudioLowerVolume" = "spawn unda msg volume down 2"
"XF86AudioMute" = "spawn unda msg volume mute"

"XF86AudioPlay" = "spawn playerctl play-pause"
"XF86AudioNext" = "spawn playerctl next"
"XF86AudioPrev" = "spawn playerctl previous"

"XF86MonBrightnessUp" = "spawn unda msg brightness up 5"
"XF86MonBrightnessDown" = "spawn unda msg brightness down 5"
