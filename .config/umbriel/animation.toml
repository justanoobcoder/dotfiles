[animation]
enabled = true
curve = "spring:1,900"

[animation.windows_in]
enabled = true
curve = "spring:0.8,900"
style = "popin"
scale = 0.6

[animation.windows_out]
enabled = true
curve = "spring:1,1200"
style = "popin"
scale = 0.8

[animation.windows_move]
enabled = true
curve = "spring:0.9,850"

[animation.workspaces]
enabled = true
curve = "spring:0.85,750"

[animation.overview]
enabled = true
curve = "spring:1,800"
workspace_curve = "spring:0.9,900"

[animation.scratchpad]
enabled = true
curve = "spring:0.9,800"
dim = 0.8
blur = true
scale = 0.1
maximize = false
fullscreen = false

[animation.border]
enabled = true
curve = "spring:1,900"

[animation.dim_unfocused]
enabled = true
dim = 0.15

[animation.layers]
enabled = true

[animation.springs]
snappy = { damping = 1, stiffness = 1000 }
bouncy = { damping = 0.6, stiffness = 700 }
smooth = { damping = 0.9, stiffness = 800 }
